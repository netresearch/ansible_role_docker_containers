---
- name: Ensure Docker service exists and is started
  ansible.builtin.service:
    name: docker
    state: started
  register: docker_status
  ignore_errors: true

- name: Inform user that the Docker daemon isn't running
  ansible.builtin.fail:
    msg: Make sure your host has the Docker daemon installed and running
  when: >
    docker_status.failed | bool or docker_status.state != "started"

# Everything below works on container NAMES (plain strings) and resolves a
# container's full definition only inside the task that actually manages it.
# On ansible-core >= 2.19 templating is lazy per value, so this guarantees a
# broken Jinja value (e.g. a failing secret lookup) in one entry can never
# block other entries - values of unselected containers are simply never
# rendered (#31). The `name` key itself must therefore be a plain string.
- name: Derive the defined container names
  ansible.builtin.set_fact:
    netresearch_docker_containers_names: >-
      {{ netresearch_docker_containers | map(attribute='name') | list }}

- name: Resolve the container selection filter to a list
  ansible.builtin.set_fact:
    # Accept either a real list (["dns", "composer"]) or a comma-separated
    # string, the latter being convenient on the command line:
    #   -e 'netresearch_docker_containers_only=dns'
    netresearch_docker_containers_only_list: >-
      {{
        (netresearch_docker_containers_only | default([], true))
        if ((netresearch_docker_containers_only | default([], true)) is sequence
            and (netresearch_docker_containers_only | default([], true)) is not string)
        else ((netresearch_docker_containers_only | default('', true)) | string
              | split(',') | map('trim') | reject('equalto', '') | list)
      }}

- name: Fail when a requested container is not defined
  ansible.builtin.fail:
    msg: >-
      netresearch_docker_containers_only requested unknown container(s):
      {{ netresearch_docker_containers_only_list
         | difference(netresearch_docker_containers_names) }}
  when:
    - netresearch_docker_containers_only_list | length > 0
    - (netresearch_docker_containers_only_list
       | difference(netresearch_docker_containers_names))
       | length > 0

- name: Select the containers to manage (all unless a filter is given)
  ansible.builtin.set_fact:
    netresearch_docker_containers_selected_names: >-
      {{
        netresearch_docker_containers_names
        if (netresearch_docker_containers_only_list | length == 0)
        else (netresearch_docker_containers_names
              | select('in', netresearch_docker_containers_only_list) | list)
      }}

- name: Report the active container selection
  ansible.builtin.debug:
    msg: >-
      Limiting this run to {{ netresearch_docker_containers_selected_names }}
      (of {{ netresearch_docker_containers_names }})
  when: netresearch_docker_containers_only_list | length > 0

- name: Collect the network names of the selected containers
  ansible.builtin.set_fact:
    netresearch_docker_containers_network_names: >-
      {{ (netresearch_docker_containers_network_names | default([]))
         + (nrc_definition.networks | default([])) }}
  loop: "{{ netresearch_docker_containers_selected_names }}"
  loop_control:
    loop_var: nrc_name
    label: "{{ nrc_name }}"
  vars:
    nrc_definition: >-
      {{ netresearch_docker_containers
         | selectattr('name', 'equalto', nrc_name) | list | first }}

- name: Create networks
  loop: "{{ netresearch_docker_containers_network_names | default([]) | flatten | unique }}"
  when: item.name != "default"
  community.docker.docker_network:
    name: "{{ item.name }}"

- name: Start container
  ansible.builtin.include_tasks: container.yml
  loop: "{{ netresearch_docker_containers_selected_names }}"
  loop_control:
    # Loop over the name string and resolve the definition via `vars` below:
    # the definition (and any lookups in it) is only templated inside this
    # container's own iteration.
    loop_var: nrc_name
    label: "{{ nrc_name }}"
  vars:
    item: >-
      {{ netresearch_docker_containers
         | selectattr('name', 'equalto', nrc_name) | list | first }}
