# Molecule + lint CI for the role.
#
# Jobs run through the org's shared reusable workflows in
# netresearch/.github, so the pinned action versions (checkout,
# setup-python) are maintained centrally instead of per-repo.
name: Molecule

on: push

permissions: {}

jobs:
  molecule:
    name: Run molecule against role
    uses: netresearch/.github/.github/workflows/ansible-molecule.yml@main
    permissions:
      contents: read
    with:
      # TODO: Remove `requests` version pin https://github.com/ansible-community/molecule-plugins/issues/256
      pip-packages: "ansible molecule molecule-docker requests<2.32.0"
      molecule-env: |
        ANSIBLE_ALLOW_BROKEN_CONDITIONALS=true

  lint:
    name: Lint role
    uses: netresearch/.github/.github/workflows/ansible-lint.yml@main
    permissions:
      contents: read
    with:
      pip-packages: "ansible ansible-lint yamllint"
      galaxy-requirements: requirements.yml

  no-log-leak:
    name: Guard container login credentials against play-output leak
    uses: netresearch/.github/.github/workflows/ansible-molecule.yml@main
    permissions:
      contents: read
    with:
      # TODO: Remove `requests` version pin https://github.com/ansible-community/molecule-plugins/issues/256
      pip-packages: "ansible molecule molecule-docker requests<2.32.0"
      command: converge
      scenario: no-log-leak
      destroy-after: true
      # Fails if the no_log deploy token leaks into play output, and if the
      # converge itself did not run (so the guard cannot pass vacuously).
      assert-output-absent: CANARY_DEPLOY_TOKEN_must_not_appear
      molecule-env: |
        ANSIBLE_ALLOW_BROKEN_CONDITIONALS=true
        ANSIBLE_FORCE_COLOR=0

  only-filter-isolation:
    name: Guard the only-filter against templating unselected entries
    uses: netresearch/.github/.github/workflows/ansible-molecule.yml@main
    permissions:
      contents: read
    with:
      # TODO: Remove `requests` version pin https://github.com/ansible-community/molecule-plugins/issues/256
      pip-packages: "ansible molecule molecule-docker requests<2.32.0"
      command: test
      scenario: only-filter-isolation
      destroy-after: true
      molecule-env: |
        ANSIBLE_ALLOW_BROKEN_CONDITIONALS=true
        ANSIBLE_FORCE_COLOR=0
